<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" style="background:#080A12; font-family:'Plus Jakarta Sans', system-ui, sans-serif;">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow circles -->
  <circle cx="200" cy="150" r="250" fill="#6366F1" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1400" cy="200" r="300" fill="#A855F7" opacity="0.07" filter="url(#glow)"/>
  <circle cx="800" cy="850" r="350" fill="#06B6D4" opacity="0.06" filter="url(#glow)"/>

  <!-- Header -->
  <text x="800" y="55" text-anchor="middle" fill="url(#titleGrad)" font-size="32" font-weight="800" letter-spacing="-0.5">Context-Aware Multi-Input PPTX Generator</text>
  <text x="800" y="85" text-anchor="middle" fill="#94A3B8" font-size="16" font-weight="500">Complete End-to-End System Architecture</text>

  <!-- LAYER 1: Inputs & UI -->
  <g transform="translate(80, 115)">
    <rect width="1440" height="135" rx="16" fill="#0F172A" fill-opacity="0.7" stroke="#334155" stroke-width="1.5"/>
    <rect x="20" y="-12" width="280" height="24" rx="12" fill="url(#violetGrad)"/>
    <text x="160" y="4" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" letter-spacing="0.5">1. USER &amp; MULTI-MODAL INPUT LAYER</text>

    <!-- Cards inside Layer 1 -->
    <rect x="30" y="28" width="320" height="85" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="50" y="58" fill="#F8FAFC" font-size="15" font-weight="700">📝 Creative Brief &amp; Prompt</text>
    <text x="50" y="82" fill="#94A3B8" font-size="12">Natural language topic, audience, instructions</text>

    <rect x="380" y="28" width="320" height="85" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="400" y="58" fill="#F8FAFC" font-size="15" font-weight="700">🎬 YouTube Video URLs</text>
    <text x="400" y="82" fill="#94A3B8" font-size="12">Single or batch video links for subtitle extraction</text>

    <rect x="730" y="28" width="320" height="85" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="750" y="58" fill="#F8FAFC" font-size="15" font-weight="700">📄 Knowledge Documents</text>
    <text x="750" y="82" fill="#94A3B8" font-size="12">Multi-upload: .pdf, .docx, .pptx files</text>

    <rect x="1080" y="28" width="330" height="85" rx="12" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="1100" y="58" fill="#C084FC" font-size="15" font-weight="700">⚙️ BYOK Provider &amp; Mode</text>
    <text x="1100" y="82" fill="#94A3B8" font-size="12">Gemini, OpenRouter, OpenAI, Groq, Ollama</text>
  </g>

  <!-- Down Arrows L1 -> L2 -->
  <line x1="800" y1="250" x2="800" y2="285" stroke="#6366F1" stroke-width="2.5" stroke-dasharray="6 4"/>

  <!-- LAYER 2: Parsing & Ingestion -->
  <g transform="translate(80, 285)">
    <rect width="1440" height="125" rx="16" fill="#0F172A" fill-opacity="0.7" stroke="#1E3A8A" stroke-width="1.5"/>
    <rect x="20" y="-12" width="280" height="24" rx="12" fill="url(#cyanGrad)"/>
    <text x="160" y="4" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" letter-spacing="0.5">2. INGESTION &amp; PARSERS SUBSYSTEM</text>

    <rect x="30" y="25" width="320" height="80" rx="12" fill="#172554" stroke="#2563EB" stroke-width="1"/>
    <text x="50" y="55" fill="#60A5FA" font-size="14" font-weight="700">youtube_parser.py</text>
    <text x="50" y="78" fill="#94A3B8" font-size="12">YouTubeTranscriptApi + video ID extractor</text>

    <rect x="380" y="25" width="320" height="80" rx="12" fill="#172554" stroke="#2563EB" stroke-width="1"/>
    <text x="400" y="55" fill="#60A5FA" font-size="14" font-weight="700">document_parser.py (PDF)</text>
    <text x="400" y="78" fill="#94A3B8" font-size="12">PyMuPDF (fitz) page text &amp; table parsing</text>

    <rect x="730" y="25" width="320" height="80" rx="12" fill="#172554" stroke="#2563EB" stroke-width="1"/>
    <text x="750" y="55" fill="#60A5FA" font-size="14" font-weight="700">document_parser.py (DOCX/PPT)</text>
    <text x="750" y="78" fill="#94A3B8" font-size="12">python-docx &amp; python-pptx structural reader</text>

    <rect x="1080" y="25" width="330" height="80" rx="12" fill="#172554" stroke="#2563EB" stroke-width="1"/>
    <text x="1100" y="55" fill="#60A5FA" font-size="14" font-weight="700">utils/helpers.py (Normalizer)</text>
    <text x="1100" y="78" fill="#94A3B8" font-size="12">Sanitization, sentence limits &amp; metrics regex</text>
  </g>

  <!-- Down Arrows L2 -> L3 -->
  <line x1="800" y1="410" x2="800" y2="445" stroke="#3B82F6" stroke-width="2.5" stroke-dasharray="6 4"/>

  <!-- LAYER 3: AI Brain & Resilience -->
  <g transform="translate(80, 445)">
    <rect width="1440" height="155" rx="16" fill="#1E1B4B" fill-opacity="0.6" stroke="#7C3AED" stroke-width="2"/>
    <rect x="20" y="-12" width="320" height="24" rx="12" fill="url(#violetGrad)"/>
    <text x="180" y="4" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" letter-spacing="0.5">3. AI ORCHESTRATION &amp; RESILIENCE BRAIN</text>

    <!-- AI Providers Gateway -->
    <rect x="30" y="30" width="680" height="105" rx="12" fill="#0F172A" stroke="#6366F1" stroke-width="1"/>
    <text x="50" y="58" fill="#A855F7" font-size="14" font-weight="700">Multi-Provider Router (unified_director.py)</text>
    <text x="50" y="82" fill="#E2E8F0" font-size="13">• Google Gemini: gemini-3.5-flash, gemini-3.5-flash-lite, gemini-3.8-flash</text>
    <text x="50" y="104" fill="#E2E8F0" font-size="13">• OpenRouter / OpenAI / Groq: DeepSeek Chat, Claude 3.5 Sonnet, GPT-4o, Llama 3.3</text>
    <text x="50" y="124" fill="#94A3B8" font-size="11.5">Unified OpenAI-compatible adapter with dynamic endpoint switching</text>

    <!-- Resilience Guard -->
    <rect x="740" y="30" width="670" height="105" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <text x="760" y="58" fill="#34D399" font-size="14" font-weight="700">Self-Healing &amp; Resilience Subsystem</text>
    <text x="760" y="82" fill="#E2E8F0" font-size="13">• RobustNamespace: Auto-string resolution preventing icon/pose NameErrors</text>
    <text x="760" y="104" fill="#E2E8F0" font-size="13">• Exponential Backoff &amp; Fallback Chain (1s → 2s → 4s on 503 load)</text>
    <text x="760" y="124" fill="#34D399" font-size="12" font-weight="600">• 2-Stage Auto-Repair Loop: Feed execution tracebacks back to LLM for auto-fix</text>
  </g>

  <!-- Branching Arrows L3 -> L4 -->
  <line x1="440" y1="600" x2="440" y2="640" stroke="#A855F7" stroke-width="2.5" stroke-dasharray="6 4"/>
  <line x1="1160" y1="600" x2="1160" y2="640" stroke="#06B6D4" stroke-width="2.5" stroke-dasharray="6 4"/>

  <!-- LAYER 4: Dual Generation Engines -->
  <g transform="translate(80, 640)">
    <!-- Path A: Procedural Canvas Engine -->
    <rect x="0" y="0" width="710" height="205" rx="16" fill="#0F172A" fill-opacity="0.7" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect x="20" y="-12" width="310" height="24" rx="12" fill="url(#violetGrad)"/>
    <text x="175" y="4" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" letter-spacing="0.5">ENGINE A: PROCEDURAL CANVAS (slide_builder.py)</text>

    <text x="30" y="40" fill="#F8FAFC" font-size="13" font-weight="700">PresentationDeck &amp; SlideCanvas Component Suite:</text>
    <text x="30" y="65" fill="#CBD5E1" font-size="12">• 13 High-Level Slide Components (Bento Grids, Timelines, Comparisons, Hero)</text>
    <text x="30" y="88" fill="#CBD5E1" font-size="12">• Theme System (theme.py): 60-30-10 Rule (BW_Doodle, Dark_Modern, Executive)</text>
    <text x="30" y="111" fill="#CBD5E1" font-size="12">• Drawing Primitives (primitives.py): Native DrawingML + CairoSVG vector engine</text>

    <!-- Embedded Vector Asset Bank Box -->
    <rect x="20" y="128" width="670" height="62" rx="10" fill="#14532D" fill-opacity="0.4" stroke="#22C55E" stroke-width="1"/>
    <text x="35" y="152" fill="#4ADE80" font-size="13" font-weight="700">🎨 2,453 Vector Assets (assets/catalog.json):</text>
    <text x="35" y="174" fill="#86EFAC" font-size="12">38 Open Doodles &amp; Chibi Characters + 2,415 Lucide Line Icons across 11 Categories</text>

    <!-- Path B: Template Infill Engine -->
    <rect x="730" y="0" width="710" height="205" rx="16" fill="#0F172A" fill-opacity="0.7" stroke="#0EA5E9" stroke-width="1.5"/>
    <rect x="750" y="-12" width="310" height="24" rx="12" fill="url(#cyanGrad)"/>
    <text x="905" y="4" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" letter-spacing="0.5">ENGINE B: TEMPLATE INFILL (template_engine.py)</text>

    <text x="760" y="40" fill="#F8FAFC" font-size="13" font-weight="700">Non-Destructive Placeholder Infill Engine:</text>
    <text x="760" y="65" fill="#CBD5E1" font-size="12">• Clones master slides from templates/ (Corporate Clean, Dark Executive)</text>
    <text x="760" y="88" fill="#CBD5E1" font-size="12">• In-place text run replacement preserving 100% of master layouts, fonts &amp; colors</text>
    <text x="760" y="111" fill="#CBD5E1" font-size="12">• Supports user-uploaded custom .pptx templates via Streamlit</text>

    <rect x="750" y="128" width="670" height="62" rx="10" fill="#1E3A8A" fill-opacity="0.4" stroke="#38BDF8" stroke-width="1"/>
    <text x="765" y="152" fill="#7DD3FC" font-size="13" font-weight="700">📋 Template Repository (templates/):</text>
    <text x="765" y="174" fill="#BAE6FD" font-size="12">Corporate Clean.pptx, Dark Executive.pptx + Custom Branded Master Decks</text>
  </g>

  <!-- Converging Arrows L4 -> L5 -->
  <line x1="440" y1="845" x2="760" y2="880" stroke="#A855F7" stroke-width="2.5" stroke-dasharray="6 4"/>
  <line x1="1160" y1="845" x2="840" y2="880" stroke="#06B6D4" stroke-width="2.5" stroke-dasharray="6 4"/>

  <!-- LAYER 5: Output & Delivery -->
  <g transform="translate(80, 880)">
    <rect width="1440" height="95" rx="16" fill="#701A75" fill-opacity="0.3" stroke="#E879F9" stroke-width="2"/>
    <rect x="20" y="-12" width="220" height="24" rx="12" fill="url(#titleGrad)"/>
    <text x="130" y="4" text-anchor="middle" fill="#080A12" font-size="12" font-weight="800" letter-spacing="0.5">5. FINAL DELIVERABLE</text>

    <text x="50" y="42" fill="#FDF4FF" font-size="17" font-weight="800">📊 Executive PowerPoint Presentation (.pptx)</text>
    <text x="50" y="68" fill="#F5D0FE" font-size="13">Native 16:9 Widescreen • Fully Editable Shapes, Bento Grids &amp; Native DrawingML Charts • Zero Distortion</text>

    <rect x="1080" y="20" width="330" height="55" rx="12" fill="#86198F" fill-opacity="0.6" stroke="#F472B6" stroke-width="1.5"/>
    <text x="1245" y="45" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">⚡ Real-Time Streaming Status</text>
    <text x="1245" y="63" text-anchor="middle" fill="#FBCFE8" font-size="11">st.status step-by-step progress bus</text>
  </g>
</svg>