  <path d="M 62 98 L 62 140" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left arm on hip -->
  <path d="M 62 106 L 44 118 L 50 130" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Right arm gesturing to board -->
  <path d="M 62 106 L 90 100 L 112 84" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 112 84 L 120 80" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M 112 84 L 121 85" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M 112 84 L 118 89" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Legs -->
  <path d="M 62 140 L 50 180 L 42 180" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 62 140 L 74 180 L 82 180" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Easel & Presentation Board -->
  <rect x="116" y="42" width="72" height="52" rx="4" stroke="#000000" stroke-width="2.5" fill="none"/>
  <line x1="110" y1="94" x2="194" y2="94" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="128" y1="94" x2="118" y2="180" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="176" y1="94" x2="186" y2="180" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="152" y1="94" x2="152" y2="174" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <!-- Chart inside board -->
  <line x1="124" y1="82" x2="180" y2="82" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M 126 77 L 140 68 L 154 72 L 176 52" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 170 52 L 176 52 L 176 58" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
